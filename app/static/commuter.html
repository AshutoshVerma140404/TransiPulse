        * {

            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f8fafc;
            color: #0f172a;
        }

        /* ========================================
           RATING CARD
        ======================================== */

        .rating-row {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding: 0.75rem 0.95rem 0.85rem;
            border-radius: 1rem;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            transition: all 0.15s ease;
        }

        .rating-row:hover {
            border-color: #cbd5e1;
            background: #fafafa;
        }

        /* Heading + Rating text */
        .rating-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-height: 20px;
        }

        .rating-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: #1e293b;
        }

        .rating-value {
            font-size: 0.7rem;
            font-weight: 700;
            color: #94a3b8;
            min-width: 60px;
            text-align: right;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            transition: background 0.2s, color 0.2s;
        }

        /* Score colour pills */
        .rating-score-1 { background: #fee2e2; color: #991b1b; } /* dark red   */
        .rating-score-2 { background: #fecaca; color: #dc2626; } /* light red  */
        .rating-score-3 { background: #dbeafe; color: #1d4ed8; } /* blue       */
        .rating-score-4 { background: #dcfce7; color: #15803d; } /* light green*/
        .rating-score-5 { background: #bbf7d0; color: #166534; } /* dark green */

        /* ========================================
           EMOJIS
        ======================================== */

        .emoji-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 0.45rem;
        }

        .emoji-btn {
            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 1.5rem;
            line-height: 1;

            width: 42px;
            height: 42px;

            padding: 0.35rem;

            border-radius: 0.65rem;
            cursor: pointer;

            transition:
                transform 0.15s ease,
                color 0.2s ease,
                background-color 0.15s ease;

            user-select: none;

            background: transparent;
            border: none;

            color: #cbd5e1;  /* grey by default */
        }

        .emoji-btn:hover {
            transform: scale(1.2);
            color: #fbbf24;  /* gold on hover */
        }

        .emoji-btn:active {
            transform: scale(0.92);
        }

        .emoji-btn.active {
            color: #f59e0b;  /* filled gold */
            transform: scale(1.1);
        }

        /* ========================================
           INPUTS
        ======================================== */

        .input-box {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 0.875rem;
            padding: 0.75rem 2.25rem 0.75rem 1rem;

            font-size: 0.9rem;
            color: #0f172a;

            outline: none;

            transition: all 0.15s ease;

            width: 100%;
            appearance: none;
        }

        .input-box:focus {
            background: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        /* ========================================
           MAIN CARD
        ======================================== */

        .app-card {
            background: #ffffff;
            border-radius: 1.75rem;
            border: 1px solid #e2e8f0;

            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.06);
        }

        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 380px) {
            .emoji-btn {
                width: 38px;
                height: 38px;
                font-size: 1.3rem;
            }

            .rating-row {
                padding-left: 0.75rem;
                padding-right: 0.75rem;
            }
        }
    </style>

    <script>

        /* ========================================
           QR URL PARAM PRE-FILL
        ======================================== */

        (function applyQRParams() {
            const params = new URLSearchParams(window.location.search);
            const qrRoute = params.get('route');
            const qrBus   = params.get('bus');

            if (!qrRoute && !qrBus) return; // normal web session

            /* ── Route ── */
            if (qrRoute) {
                const sel = document.getElementById('routeSelect');
                /* Try to match an existing option */
                let matched = false;
                for (const opt of sel.options) {
                    if (opt.value === qrRoute) { opt.selected = true; matched = true; break; }
                }
                /* If not matched, inject an option */
                if (!matched) {
                    const opt = document.createElement('option');
                    opt.value = qrRoute;
                    opt.textContent = qrRoute;
                    opt.selected = true;
                    sel.appendChild(opt);
                }
                /* Lock it */
                sel.disabled = true;
                sel.classList.add('opacity-70', 'cursor-not-allowed');
            }

            /* ── Bus Number ── */
            if (qrBus) {
                const input = document.getElementById('busDigits');
                input.value = qrBus.replace(/^UP53\s*K\s*/i, '').trim();
                input.readOnly = true;
                input.classList.add('opacity-70', 'cursor-not-allowed');
            }

            window._qrScanned = true;
        })();


        /* ========================================
           STATE
        ======================================== */

        const state = {
            punctuality: 0,
            cleanliness: 0,
            crowding: 0,
            driver: 0,
            overall: 0
        };


        /* ========================================
           RATING LABELS
        ======================================== */

        const ratingLabels = {
            1: "Bad",
            2: "Poor",
            3: "Average",
            4: "Good",
            5: "Excellent"
        };


        /* ========================================
           RATE FUNCTION
        ======================================== */

        function rate(cat, score) {

            state[cat] = score;

            const container = document.querySelector(
                `.emoji-group[data-cat="${cat}"]`
            );

            if (container) {

                const buttons = container.querySelectorAll(".emoji-btn");

                buttons.forEach((button, index) => {

                    /* Fill all stars up to and including the selected one */
                    if (index + 1 <= score) {

                        button.classList.add("active");

                    } else {

                        button.classList.remove("active");

                    }

                });

            }


            /* Update rating text */

            const label = document.getElementById(
                `rating-label-${cat}`
            );

            if (label) {

                /* Remove all previous score colour classes */
                label.classList.remove(
                    "rating-score-1", "rating-score-2",
                    "rating-score-3", "rating-score-4", "rating-score-5"
                );

                if (score > 0) {

                    label.textContent = ratingLabels[score];
                    label.classList.add(`rating-score-${score}`);

                } else {

                    label.textContent = "";

                }

            }

        }


        /* ========================================
           SUBMIT FEEDBACK
        ======================================== */

        async function submitFeedback(e) {

            e.preventDefault();


            const btn = document.getElementById("submitBtn");

            btn.disabled = true;

            btn.textContent = "Submitting...";


            /* Bus number */

            const digits = document
                .getElementById("busDigits")
                .value
                .trim();

            const busId = digits
                ? `UP53 K ${digits}`
                : null;


            /* API payload */

            const payload = {

                route_id:
                    document.getElementById("routeSelect").value,

                trip_id:
                    null,

                punctuality_rating:
                    state.punctuality || null,

                cleanliness_rating:
                    state.cleanliness || null,

                crowding_rating:
                    state.crowding || null,

                driver_rating:
                    state.driver || null,

                overall_rating:
                    state.overall || 4.0,

                raw_comment:
                    document.getElementById("commentBox").value.trim() || null,

                stop_name:
                    document.getElementById("stopSelect").value || null,

                bus_id:
                    busId,

                channel:
                    (window._qrScanned ? "QR_CODE" : "WEB")
            };


            try {

                const res = await fetch(
                    "/api/v1/feedback/",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(payload)
                    }
                );


                /* Reference ID */

                const ref =
                    "UP53-" +
                    Math.floor(
                        1000 + Math.random() * 9000
                    );


                document.getElementById(
                    "refCode"
                ).textContent = ref;


                /* Show success */

                document
                    .getElementById("feedbackForm")
                    .classList.add("hidden");

                document
                    .getElementById("pageHeading")
                    .classList.add("hidden");

                document
                    .getElementById("successCard")
                    .classList.remove("hidden");


            } catch (err) {

                /*
                    Keep the same success behaviour
                    as the original implementation.
                */

                document.getElementById(
                    "refCode"
                ).textContent =
                    "UP53-" +
                    Math.floor(
                        1000 + Math.random() * 9000
                    );


                document
                    .getElementById("feedbackForm")
                    .classList.add("hidden");

                document
                    .getElementById("pageHeading")
                    .classList.add("hidden");

                document
                    .getElementById("successCard")
                    .classList.remove("hidden");

            } finally {

                btn.disabled = false;

                btn.textContent = "Submit Feedback";

            }

        }


        /* ========================================
           COPY REFERENCE ID
        ======================================== */

        function copyRefId() {

            const text = document.getElementById("refCode").textContent.trim();
            const btn  = document.getElementById("copyRefBtn");

            navigator.clipboard.writeText(text).then(() => {

                /* Swap to a tick icon briefly */
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
                btn.classList.add("text-green-500");

                setTimeout(() => {

                    btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
                    btn.classList.remove("text-green-500");

                }, 1800);

            });

        }


        /* ========================================
           RESET FORM
        ======================================== */

        function resetForm() {

            /* Clear inputs */

            document.getElementById(
                "commentBox"
            ).value = "";

            document.getElementById(
                "busDigits"
            ).value = "";


            /* Reset ratings */

            rate("punctuality", 0);

            rate("cleanliness", 0);

            rate("crowding", 0);

            rate("driver", 0);

            rate("overall", 0);


            /* Reset success state */

            document
                .getElementById("successCard")
                .classList.add("hidden");

            document
                .getElementById("pageHeading")
                .classList.remove("hidden");

            document
                .getElementById("feedbackForm")
                .classList.remove("hidden");

        }

    </script>
